<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#9b59b6" />
  <meta name="description" content="Anchor - Voice De-escalation. Stay steady. You're in control." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Anchor" />
  
  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json" />
  
  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
  
  <title>Anchor - Voice De-escalation</title>
  
  <!-- Debug and Error Logging -->
  <script>
    // Catch all errors
    window.onerror = function(message, source, lineno, colno, error) {
      console.error('[Global Error]', {message, source, lineno, colno, error});
      return false;
    };
    
    window.addEventListener('unhandledrejection', function(event) {
      console.error('[Unhandled Promise]', event.reason);
    });
    
    console.log('[Anchor] Page loading...');
  </script>
  
  <!-- Service Worker Registration with version busting -->
  <script>
    // Unregister old service workers and register new one
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        console.log('[PWA] Starting service worker cleanup...');
        
        // First, unregister all existing service workers
        navigator.serviceWorker.getRegistrations().then(registrations => {
          console.log('[PWA] Found', registrations.length, 'service workers');
          registrations.forEach(registration => {
            registration.unregister();
          });
        });
        
        // Clear all caches
        if ('caches' in window) {
          caches.keys().then(names => {
            console.log('[PWA] Found', names.length, 'caches');
            names.forEach(name => {
              caches.delete(name);
            });
          });
        }
        
        // Register new service worker after a short delay
        setTimeout(() => {
          navigator.serviceWorker.register('/service-worker.js?v=2')
            .then(registration => {
              console.log('[PWA] Service Worker v2 registered successfully');
            })
            .catch(error => {
              console.error('[PWA] Service Worker registration failed:', error);
            });
        }, 100);
      });
    }
  </script>
  
  <style>
    * {
      box-sizing: border-box;
    }
    
    html, body, #root {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: auto;
      background-color: #0a0a0a;
      -webkit-overflow-scrolling: touch;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }
    
    /* Full screen on iOS */
    @media (display-mode: standalone) {
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
